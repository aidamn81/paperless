<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paperless Bingo</title>
<style>
    body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(5, 70px);
        gap: 8px;
        margin-top: 20px;
    }

    .cell {
        width: 70px;
        height: 70px;
        border: 2px solid #333;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-weight: bold;
        font-size: 18px;
        user-select: none;
    }

    .marked {
        background: gold;
    }

    .free {
        background: lightgreen;
    }

    .header {
        font-size: 24px;
        font-weight: bold;
    }

    #message {
        margin-top: 15px;
        font-size: 20px;
        color: green;
        font-weight: bold;
    }

    button {
        margin: 10px 5px;
        padding: 10px 15px;
    }
</style>
</head>
<body>

<h1>BINGO</h1>

<div class="grid" id="bingoGrid"></div>

<div>
    <button onclick="generateBoard()">New Card</button>
    <button onclick="resetBoard()">Reset Marks</button>
</div>

<div id="message"></div>

<script>
const ranges = [
    [1, 15],
    [16, 30],
    [31, 45],
    [46, 60],
    [61, 75]
];

function getNumbers(min, max, count) {
    const nums = [];

    while (nums.length < count) {
        const n = Math.floor(Math.random() * (max - min + 1)) + min;
        if (!nums.includes(n)) {
            nums.push(n);
        }
    }

    return nums;
}

function generateBoard() {
    const grid = document.getElementById('bingoGrid');
    const message = document.getElementById('message');

    grid.innerHTML = '';
    message.textContent = '';

    let columns = ranges.map(r => getNumbers(r[0], r[1], 5));

    for (let row = 0; row < 5; row++) {
        for (let col = 0; col < 5; col++) {
            const cell = document.createElement('div');
            cell.className = 'cell';

            if (row === 2 && col === 2) {
                cell.textContent = 'FREE';
                cell.classList.add('marked', 'free');
            } else {
                cell.textContent = columns[col][row];
            }

            cell.addEventListener('click', () => {
                cell.classList.toggle('marked');
                checkBingo();
            });

            grid.appendChild(cell);
        }
    }
}

function resetBoard() {
    document.querySelectorAll('.cell').forEach(cell => {
        if (!cell.classList.contains('free')) {
            cell.classList.remove('marked');
        }
    });

    document.getElementById('message').textContent = '';
}

function checkBingo() {
    const cells = [...document.querySelectorAll('.cell')];
    const marked = cells.map(c => c.classList.contains('marked'));

    const wins = [];

    // Rows
    for (let r = 0; r < 5; r++) {
        wins.push([0,1,2,3,4].map(c => r * 5 + c));
    }

    // Columns
    for (let c = 0; c < 5; c++) {
        wins.push([0,1,2,3,4].map(r => r * 5 + c));
    }

    // Diagonals
    wins.push([0,6,12,18,24]);
    wins.push([4,8,12,16,20]);

    const bingo = wins.some(line =>
        line.every(index => marked[index])
    );

    document.getElementById('message').textContent =
        bingo ? 'BINGO!' : '';
}

generateBoard();
</script>

</body>
</html>
