<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paperless Bingo</title>
    <style>
        body { background: #1a1a1a; color: #d4af37; font-family: 'Cinzel', serif; padding: 20px; }
        .bingo-block { margin-bottom: 30px; border: 1px solid #d4af37; padding: 10px; }
        .block-title { text-align: center; font-size: 1.2em; margin-bottom: 10px; }
        .bingo-row { display: flex; justify-content: center; }
        .bingo-cell { 
            width: 40px; height: 40px; border: 1px solid #d4af37; 
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 14px;
        }
        .bingo-cell.marked { background: #d4af37; color: #1a1a1a; }
        /* Surgical fix: Hidden empty cells */
        .empty-cell { visibility: hidden; border: none; background: transparent; }
    </style>
</head>
<body>

<div id="bingoCard"></div>

<script>
    const playerName = "Player1";

    function seededRandom(seed) {
        return function() {
            seed = (seed * 9301 + 49297) % 233280;
            return seed / 233280;
        };
    }

    function getSeed() { return 12345; } // Change to randomize boards per user

    function renderAllBlocks() {
        const container = document.getElementById("bingoCard");
        const rng = seededRandom(getSeed());
        const marked = JSON.parse(localStorage.getItem(`marked_${playerName}`)) || {};
        
        let pool = [];
        for (let i = 0; i < 9; i++) {
            let range = [];
            for (let j = 1; j <= 10; j++) range.push(i * 10 + j);
            range.sort(() => rng() - 0.5);
            pool.push(range);
        }

        for (let b = 1; b <= 5; b++) {
            const blockDiv = document.createElement("div");
            blockDiv.className = "bingo-block";
            blockDiv.innerHTML = `<div class="block-title">Block ${b}</div>`;
            
            for (let r = 0; r < 3; r++) {
                const rowDiv = document.createElement("div");
                rowDiv.className = "bingo-row";
                let allCols = [0,1,2,3,4,5,6,7,8];
                let emptyCols = allCols.sort(() => rng() - 0.5).slice(0, 4);
                
                for (let c = 0; c < 9; c++) {
                    const cell = document.createElement("div");
                    const id = `b${b}r${r}c${c}`;
                    
                    if (!emptyCols.includes(c)) {
                        cell.className = "bingo-cell";
                        cell.textContent = pool[c].pop();
                        if (marked[id]) cell.classList.add("marked");
                        cell.onclick = () => { 
                            cell.classList.add("marked"); 
                            marked[id] = true; 
                            localStorage.setItem(`marked_${playerName}`, JSON.stringify(marked)); 
                        };
                    } else {
                        // SURGICAL FIX APPLIED HERE
                        cell.className = "bingo-cell empty-cell";
                    }
                    rowDiv.appendChild(cell);
                }
                blockDiv.appendChild(rowDiv);
            }
            container.appendChild(blockDiv);
        }
    }

    renderAllBlocks();
</script>
</body>
</html>
