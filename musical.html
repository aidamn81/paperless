<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>👠 Candy HEALS's Musical Bingo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; }
        body { background: #000000; background-image: radial-gradient(circle at top, #2b0b47 0%, #000000 70%); color: #ffffff; margin: 0; padding: 1rem; font-family: 'Segoe UI', Roboto, sans-serif; }
        
        @keyframes neonGlow {
            0% { box-shadow: 0 0 5px #9d4edd, 0 0 10px #9d4edd; }
            50% { box-shadow: 0 0 15px #c77dff, 0 0 25px #c77dff; }
            100% { box-shadow: 0 0 5px #9d4edd, 0 0 10px #9d4edd; }
        }
        
        #bingoLady { width: 120px; height: auto; margin: 0 auto 1rem auto; display: block; border-radius: 8px; border: 2px solid #c77dff; }
        .bingo-block { margin: 1.5rem auto; border: 2px solid #4b1b78; padding: 1rem; border-radius: 12px; background: #0a001a; animation: neonGlow 3s infinite ease-in-out; max-width: 95vw; overflow-x: auto; }
        
        .bingo-row { display: flex; justify-content: center; gap: 4px; margin-bottom: 4px; }
        
        /* Dynamic cell sizing to fit text */
        .bingo-cell { 
            min-width: 80px; height: 50px; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: 600; font-size: 0.75rem; 
            border: 1px solid #6a2cac; cursor: pointer; 
            user-select: none; background: #120529; color: #e0aaff; 
            text-align: center; padding: 4px; border-radius: 4px;
            line-height: 1;
        }
        
        .bingo-cell:hover { background: #240a4d; }
        .marked { background: #c77dff !important; color: #000 !important; border-color: #fff !important; }
        .empty { visibility: hidden; pointer-events: none; }
        
        .block-title { text-align: center; color: #fbbf24; font-size: 1.2rem; margin-bottom: 1rem; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        
        button { padding: 0.8rem 1.5rem; cursor: pointer; transition: all 0.2s; border-radius: 8px; font-weight: bold; }
        .btn-refresh { background: #7f1d1d; color: white; border: 1px solid #991b1b; }
        .btn-refresh:hover { background: #991b1b; }
    </style>
</head>
<body class="flex flex-col items-center">

    <img id="bingoLady" src="candy1.PNG" alt="Bingo Lady">

    <header class="w-full text-center mb-6">
        <h1 class="text-3xl font-bold text-[#c77dff]">🎀 MUSICAL BINGO 🎀</h1>
    </header>

    <div class="w-full flex justify-center mb-4">
        <button onclick="refreshSheet()" class="btn-refresh">🔄 New Unique Card</button>
    </div>

    <div id="bingoCard" class="w-full flex flex-col items-center"></div>

    <script>
        const songList = ["Dancing queen", "Believe", "Music", "Spinning around", "The best", "Every time we touch", "Rain on me", "Dancing on my own", "S&M", "Baby one more time", "Break my soul", "Blinding lights", "Dance the night", "Good 4 you", "Sweet but psycho", "Flowers", "Whenever, wherever", "I’m outta love", "I want it that way", "Bootylicious", "Milkshake", "Unwritten", "Espresso", "Untouched", "Man! I feel like a woman", "Heart of glass", "Disco inferno", "You make me feel", "Who do you think you are", "What is love", "Dirrrrty", "Bad Romance", "Play", "I wanna dance with somebody", "Rolling into deep", "Happy", "Mr brightside", "Toxic", "Don’t stop the music", "Midnight sun", "Respect", "Hung up", "All the things she said", "Sexy back", "Midnight sky", "Tik Tok", "I kissed a girl", "Murder on the dance floor", "Rehab", "Get the party started", "Hot to go", "I’m just a girl", "Sweet dreams", "Push the button", "Danceteria", "Crazy in love", "I gotta feeling", "Abracadabra", "Be my lover", "Proud Mary", "Padam padam", "Tattoo", "Mercy", "Fabulous", "Gimme gimme gimme", "Knock on wood", "Barbie girl", "New rules", "Break free", "Beat it", "Call me", "2 be loved", "Strong enough", "You spin me round", "Lady marmalade"];

        const urlParams = new URLSearchParams(window.location.search);
        const playerName = (urlParams.get("name") || "Guest").trim();
        
        function hashName(str) { let hash = 0; for (let i = 0; i < str.length; i++) hash = ((hash << 5) - hash) + str.charCodeAt(i); return Math.abs(hash); }
        function seededRandom(seed) { let s = seed; return function() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; } }

        function getCardSeed() {
            const stored = localStorage.getItem(`seed_${playerName}`);
            if (stored) return parseInt(stored);
            const n = hashName(playerName + Date.now());
            localStorage.setItem(`seed_${playerName}`, n);
            return n;
        }

        function refreshSheet() { 
            localStorage.removeItem(`seed_${playerName}`); 
            localStorage.removeItem(`marked_${playerName}`); 
            window.location.reload(); 
        }

        function renderBlocks() {
            const container = document.getElementById("bingoCard");
            const rng = seededRandom(getCardSeed());
            const marked = JSON.parse(localStorage.getItem(`marked_${playerName}`)) || {};
            
            let pool = [...songList].sort(() => rng() - 0.5);

            for (let b = 1; b <= 3; b++) {
                const blockDiv = document.createElement("div");
                blockDiv.className = "bingo-block";
                blockDiv.innerHTML = `<div class="block-title">ROUND ${b}</div>`;
                
                for (let r = 0; r < 3; r++) {
                    const rowDiv = document.createElement("div");
                    rowDiv.className = "bingo-row";
                    let emptySlots = [0,1,2,3,4,5,6,7,8].sort(() => rng() - 0.5).slice(0, 4);
                    
                    for (let c = 0; c < 9; c++) {
                        const cell = document.createElement("div");
                        const id = `b${b}r${r}c${c}`;
                        if (emptySlots.includes(c)) {
                            cell.className = "bingo-cell empty";
                        } else {
                            cell.className = "bingo-cell";
                            cell.textContent = pool.pop() || "HIT";
                            if (marked[id]) cell.classList.add("marked");
                            cell.onclick = () => { cell.classList.toggle("marked"); marked[id] = cell.classList.contains("marked"); localStorage.setItem(`marked_${playerName}`, JSON.stringify(marked)); };
                        }
                        rowDiv.appendChild(cell);
                    }
                    blockDiv.appendChild(rowDiv);
                }
                container.appendChild(blockDiv);
            }
        }
        window.onload = renderBlocks;
    </script>
</body>
</html>
