<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candy's Neon Wheel</title>
    <style>
        body { background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; font-family: sans-serif; overflow: hidden; margin: 0; }
        #top-nav { display: flex; justify-content: space-between; width: 100%; padding: 20px 30px; box-sizing: border-box; z-index: 10; }
        .neon-btn { background: #0a001a; border: 2px solid #9d4edd; color: #fff; padding: 12px 24px; border-radius: 8px; cursor: pointer; box-shadow: 0 0 15px #9d4edd; font-size: 1rem; font-weight: bold; }
        #admin-panel { background: #0a001a; padding: 2rem; border: 2px solid #4b1b78; border-radius: 12px; display: none; text-align: center; position: absolute; top: 120px; z-index: 20; }
        .close-btn { cursor: pointer; color: #9d4edd; font-size: 1.5rem; float: right; }
        canvas { filter: drop-shadow(0 0 15px #9d4edd); border-radius: 50%; }
    </style>
</head>
<body>
    <div id="top-nav">
        <button class="neon-btn" onclick="document.getElementById('admin-panel').style.display='block'">ADMIN</button>
    </div>

    <canvas id="wheel" width="400" height="400"></canvas>

    <div id="admin-panel">
        <div class="close-btn" onclick="document.getElementById('admin-panel').style.display='none'">×</div>
        <h3>Update Prizes</h3>
        <input type="text" id="prizeInput" placeholder="Prize1, Prize2, Prize3">
        <button onclick="updatePrizes()" class="neon-btn">Save Changes</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAQSRSJC11L7n5zYivGAWKZosW-emSIaos", authDomain: "paperlesscandy.firebaseapp.com", projectId: "paperlesscandy", storageBucket: "paperlesscandy.firebasestorage.app", messagingSenderId: "231190762242", appId: "1:231190762242:web:adc945167257b368eca81b" };
        const db = getFirestore(initializeApp(firebaseConfig));
        
        let prizes = ["SPIN", "DRINK", "CANDY", "WIN"];
        
        async function loadPrizes() {
            try {
                const docSnap = await getDoc(doc(db, "wheel", "prizes"));
                if (docSnap.exists()) {
                    prizes = docSnap.data().list;
                    console.log("Prizes loaded from Firebase:", prizes);
                }
            } catch (e) {
                console.error("Error loading prizes:", e);
            }
            drawWheel();
        }

        window.updatePrizes = async () => {
            const secret = prompt("Enter Admin Password:");
            if (secret === "1981") {
                const input = document.getElementById('prizeInput').value;
                const newPrizes = input.split(',').map(s => s.trim());
                try {
                    // Using setDoc with merge: true ensures we don't accidentally wipe other data
                    await setDoc(doc(db, "wheel", "prizes"), { list: newPrizes }, { merge: true });
                    prizes = newPrizes;
                    alert("Saved to Firebase!");
                    document.getElementById('admin-panel').style.display = 'none';
                    drawWheel();
                } catch (e) {
                    alert("Failed to save: " + e.message);
                }
            } else {
                alert("Wrong password!");
            }
        };

        function drawWheel() { /* Existing drawing logic... */ }
        loadPrizes();
    </script>
</body>
</html>
