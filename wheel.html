<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CANDY HEALS's SPIN THE WHEEL</title>
    <style>
        body { background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; overflow: hidden; }
        #wheel-container { position: relative; display: flex; flex-direction: column; align-items: center; }
        canvas { cursor: grab; filter: drop-shadow(0 0 15px #9d4edd); touch-action: none; border-radius: 50%; max-width: 90vw; }
        #arrow { width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-top: 30px solid #c77dff; margin-bottom: 10px; filter: drop-shadow(0 0 5px #c77dff); }
        #admin-btn { margin-top: 1rem; color: #4b1b78; cursor: pointer; font-size: 0.8rem; }
        #admin-panel { margin-top: 1rem; background: #0a001a; padding: 1rem; border: 1px solid #4b1b78; border-radius: 8px; display: none; text-align: center; }
        input { background: #120529; border: 1px solid #6a2cac; color: white; padding: 0.5rem; width: 250px; }
        button { background: linear-gradient(90deg, #7b2cbf, #9d4edd); color: white; border: none; padding: 0.5rem 1rem; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="wheel-container">
        <div id="arrow"></div>
        <canvas id="wheel" width="400" height="400"></canvas>
    </div>
    
    <div id="admin-btn" onclick="document.getElementById('admin-panel').style.display = 'block'">Admin Settings</div>
    
    <div id="admin-panel">
        <h3>Update Prizes</h3>
        <input type="text" id="prizeInput" placeholder="Prize1, Prize2, Prize3">
        <button onclick="updatePrizes()">Save Prizes</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAQSRSJC11L7n5zYivGAWKZosW-emSIaos",
            authDomain: "paperlesscandy.firebaseapp.com",
            projectId: "paperlesscandy",
            storageBucket: "paperlesscandy.firebasestorage.app",
            messagingSenderId: "231190762242",
            appId: "1:231190762242:web:adc945167257b368eca81b"
        };
        
        const db = getFirestore(initializeApp(firebaseConfig));
        let prizes = ["SPIN", "DRINK", "CANDY", "WIN"];
        const colors = ["#ff006e", "#8338ec", "#3a86ff", "#ffbe0b", "#fb5607"];
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        let angle = 0;
        let speed = 0;

        async function loadPrizes() {
            try {
                const docSnap = await getDoc(doc(db, "wheel", "prizes"));
                if (docSnap.exists()) { prizes = docSnap.data().list; }
            } catch (e) { console.error("Error loading:", e); }
            drawWheel();
        }

        window.updatePrizes = async () => {
            const input = document.getElementById('prizeInput').value;
            if(input) {
                const newPrizes = input.split(',').map(s => s.trim());
                await setDoc(doc(db, "wheel", "prizes"), { list: newPrizes });
                prizes = newPrizes;
                alert("Prizes updated!");
                drawWheel();
            }
        };

        function drawWheel() {
            const arc = Math.PI * 2 / prizes.length;
            ctx.clearRect(0, 0, 400, 400);
            prizes.forEach((p, i) => {
                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(200, 200);
                ctx.arc(200, 200, 180, i * arc + angle, (i + 1) * arc + angle);
                ctx.fill();
                
                ctx.save();
                ctx.fillStyle = "#fff";
                ctx.textAlign = "center";
                ctx.font = "bold 16px Arial";
                // Positions text horizontally relative to wheel rotation
                let textAngle = i * arc + angle + arc/2;
                ctx.translate(200 + Math.cos(textAngle) * 100, 200 + Math.sin(textAngle) * 100);
                ctx.fillText(p, 0, 0);
                ctx.restore();
            });
            angle += speed;
            speed *= 0.98;
            requestAnimationFrame(drawWheel);
        }

        let isDragging = false;
        canvas.onpointerdown = () => { isDragging = true; speed = 0; };
        canvas.onpointermove = (e) => { if(isDragging) angle += 0.1; };
        canvas.onpointerup = () => { isDragging = false; speed = 0.5; };
        loadPrizes();
    </script>
</body>
</html>
