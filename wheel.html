<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candy's Neon Wheel</title>
    <style>
        body { background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; font-family: sans-serif; overflow: hidden; margin: 0; }
        #top-nav { display: flex; justify-content: space-between; width: 100%; padding: 15px 20px; box-sizing: border-box; z-index: 10; }
        .left-menu { display: flex; flex-direction: column; gap: 10px; }
        .right-menu { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .logo { width: 80px; height: 80px; cursor: pointer; border-radius: 8px; object-fit: cover; }
        .follow-text { color: #c77dff; font-size: 0.8rem; text-decoration: underline; cursor: pointer; }
        .neon-btn { background: #0a001a; border: 1px solid #9d4edd; color: #fff; padding: 8px 16px; border-radius: 6px; cursor: pointer; box-shadow: 0 0 10px #9d4edd; }
        #wheel-container { position: relative; display: flex; flex-direction: column; align-items: center; margin-top: 10px; }
        canvas { cursor: grab; filter: drop-shadow(0 0 15px #9d4edd); touch-action: none; border-radius: 50%; max-width: 70vw; max-height: 50vh; }
        #arrow { width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-top: 30px solid #c77dff; margin-bottom: 5px; filter: drop-shadow(0 0 5px #c77dff); }
        #admin-panel { background: #0a001a; padding: 1rem; border: 1px solid #4b1b78; border-radius: 8px; display: none; text-align: center; position: absolute; top: 100px; }
    </style>
</head>
<body>

    <div id="top-nav">
        <div class="left-menu">
            <button class="neon-btn" onclick="document.getElementById('admin-panel').style.display = (document.getElementById('admin-panel').style.display === 'block' ? 'none' : 'block')">ADMIN</button>
            <button class="neon-btn" onclick="window.location.href='choose.html'">HOME</button>
        </div>
        <div class="right-menu">
            <img src="candywheel.PNG" alt="Logo" class="logo" onclick="window.open('https://www.instagram.com/candyheals/', '_blank')">
            <div class="follow-text" onclick="window.open('https://www.instagram.com/candyheals/', '_blank')">FOLLOW ME</div>
        </div>
    </div>

    <div id="wheel-container">
        <div id="arrow"></div>
        <canvas id="wheel" width="400" height="400"></canvas>
    </div>
    
    <div id="admin-panel">
        <h3>Update Prizes</h3>
        <input type="text" id="prizeInput" placeholder="Prize1, Prize2, Prize3">
        <button onclick="updatePrizes()" class="neon-btn">Save</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAQSRSJC11L7n5zYivGAWKZosW-emSIaos", authDomain: "paperlesscandy.firebaseapp.com", projectId: "paperlesscandy", storageBucket: "paperlesscandy.firebasestorage.app", messagingSenderId: "231190762242", appId: "1:231190762242:web:adc945167257b368eca81b" };
        const db = getFirestore(initializeApp(firebaseConfig));
        let prizes = ["SPIN", "DRINK", "CANDY", "WIN"];
        const colors = ["#ff006e", "#8338ec", "#3a86ff", "#ffbe0b", "#fb5607"];
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        let angle = 0, speed = 0;

        async function loadPrizes() {
            try { const docSnap = await getDoc(doc(db, "wheel", "prizes")); if (docSnap.exists()) prizes = docSnap.data().list; } catch (e) { }
            drawWheel();
        }

        function drawWheel() {
            const arc = Math.PI * 2 / prizes.length;
            ctx.clearRect(0, 0, 400, 400);
            prizes.forEach((p, i) => {
                const midAngle = i * arc + angle + arc / 2;
                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(200, 200);
                ctx.arc(200, 200, 180, i * arc + angle, (i + 1) * arc + angle);
                ctx.lineTo(200, 200);
                ctx.fill();
                
                ctx.save();
                ctx.fillStyle = "#fff";
                ctx.textAlign = "center";
                ctx.font = "bold 14px Arial";
                ctx.translate(200, 200);
                ctx.rotate(midAngle);
                ctx.translate(100, 0);
                if (midAngle > Math.PI / 2 && midAngle < 3 * Math.PI / 2) ctx.rotate(Math.PI);
                
                // Wrap text if needed
                const words = p.split(' ');
                words.forEach((word, index) => {
                    ctx.fillText(word, 0, (index * 16) - ((words.length - 1) * 8));
                });
                ctx.restore();
            });
            angle += speed;
            speed *= 0.98;
            if (Math.abs(speed) < 0.001) speed = 0;
            requestAnimationFrame(drawWheel);
        }

        window.updatePrizes = async () => {
            const input = document.getElementById('prizeInput').value;
            if(input) {
                prizes = input.split(',').map(s => s.trim());
                await setDoc(doc(db, "wheel", "prizes"), { list: prizes });
                alert("Prizes updated!");
            }
        };

        canvas.onpointerdown = () => { speed = 0; };
        canvas.onpointerup = () => { speed = (Math.random() * 0.5) + 0.3; };
        loadPrizes();
    </script>
</body>
</html>
